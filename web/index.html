<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tally</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0 auto; max-width: 640px; padding: 32px 16px; color: #222; }
  h1 { font-size: 24px; margin: 0 0 16px; }
  textarea { box-sizing: border-box; display: block; font: inherit; height: 180px; padding: 8px; width: 100%; }
  p { margin: 12px 0; }
  .result { background: #222; border-radius: 4px; color: #fff; font-size: 24px; font-weight: 600; line-height: 1.3; margin: 0 0 16px; padding: 14px 16px; }
  .result:empty { background: none; min-height: 1.3em; }
</style>
</head>
<body>
<h1>tally</h1>
<p class="result" data-testid="result" aria-live="polite" aria-atomic="true"></p>
<label for="text">Text to count</label>
<textarea id="text" data-testid="text-input">The cat and the dog</textarea>
<script type="module">
  import { countWords } from '/count.js';
  const input = document.getElementById('text');
  const result = document.querySelector('[data-testid="result"]');
  function update() {
    const { total, unique } = countWords(input.value);
    const text = `${total} words, ${unique} unique`;
    if (result.textContent !== text) result.textContent = text;
  }
  input.addEventListener('input', update);
  update();
</script>
</body>
</html>
